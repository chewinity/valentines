<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffcccb;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        h1 {
            font-size: 3em;
            color: #e63946;
        }
        p {
            font-size: 1.5em;
        }
        .heart {
            font-size: 5em;
            color: #eb3ab6;
        }
        .button {
            background-color: #f1faee;
            border: none;
            color: #1d3557;
            padding: 15px 30px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 1.2em;
            margin: 20px 2px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #a8dadc;
        }
    </style>
    <script>
        function handleYes() {
            alert("Yay! I'm so happy you said yes! ❤️");
        }

        function handleMaybe() {
            alert("That's okay! Take your time to think about it! 💖");
        }

        function handleNo() {
            alert("I'm sorry to hear that. Maybe next time! 😢");
        }
    </script>
</head>
<body>

    <h1>Will You Be My Valentine?</h1>
    <div class="heart">❤️</div>
    <p>Hello Babu!</p>
    <p>You're amazing, wonderful, gorgeous, and I would love to spend Valentine's Day with you!</p>
    <button class="button" onclick="handleYes()">Yes! ❤️</button>
    <button class="button" onclick="handleMaybe()">Maybe... 💖</button>
    <button class="button" onclick="handleNo()">No, thanks. 😢</button>

</body>
</html>
